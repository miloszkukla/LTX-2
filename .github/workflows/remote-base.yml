name: Publish source-free remote base

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ltx-csharp
    paths:
      - Dockerfile.remote
      - .dockerignore
      - .github/workflows/remote-base.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/miloszkukla/ltx-csharp-base

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate with the workflow token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish by immutable digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.remote
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:cuda13.2-dotnet10
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Request public package visibility
        id: visibility
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H 'Accept: application/vnd.github+json' \
            /user/packages/container/ltx-csharp-base/visibility \
            -f visibility=public

      - name: Prove anonymous pull after removing credentials
        id: anonymous
        continue-on-error: true
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker image rm "${IMAGE_NAME}@${IMAGE_DIGEST}" >/dev/null 2>&1 || true
          docker pull "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Record publish result
        if: always()
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VISIBILITY_OUTCOME: ${{ steps.visibility.outcome }}
          ANONYMOUS_OUTCOME: ${{ steps.anonymous.outcome }}
        run: |
          mkdir -p /tmp/ltx-ghcr-result
          jq -n \
            --arg image "${IMAGE_NAME}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg visibility "${VISIBILITY_OUTCOME}" \
            --arg anonymous_pull "${ANONYMOUS_OUTCOME}" \
            '{image:$image,digest:$digest,visibility:$visibility,anonymous_pull:$anonymous_pull}' \
            > /tmp/ltx-ghcr-result/result.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghcr-publish-result
          path: /tmp/ltx-ghcr-result/result.json
          if-no-files-found: error
